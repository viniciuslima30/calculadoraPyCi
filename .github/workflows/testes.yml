name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]
jobs:
  qualidade:
    strategy:
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04, ubuntu-latest ]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configurar Python
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # 1. ANÁLISE DE CÓDIGO
      - name: Executar Linter
        run: python -m flake8 calculadora.py
      # 2 e 3. TESTES UNITÁRIOS E COBERTURA (Unificados para poupar tempo)
      - name: Executar testes e verificar cobertura
        run: |
          python -m pytest --cov=calculadora --cov-report=term-missing --cov-fail-under=80
      # 4. SEGURANÇA
      - name: Security Scan
        uses: gitleaks/gitleaks-action@e6dab246340401bf53eec993b8f05aebe80ac636 # v2.3.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 5. ANÁLISE COM SONARQUBE
      - name: Análise com SonarQube
        uses: SonarSource/sonarqube-scan-action@53c3e3207aa4b4d4d5bc3e18911575317d66bc92 # v7.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
